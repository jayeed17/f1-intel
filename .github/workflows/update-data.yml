name: Update prebuilt race data

on:
  schedule:
    # Monday 02:00 UTC covers essentially every race (latest Sunday finish is
    # ~22:00 UTC); Monday 14:00 UTC is a second pass for anything F1/OpenF1
    # hadn't published yet by the first run (--only-missing makes this cheap).
    # Both Monday runs also score last weekend's race predictions, and log a
    # pre-weekend quali + race v2 forecast for whatever's coming up next.
    - cron: "0 2 * * 1"
    - cron: "0 14 * * 1"
    # Hourly across Saturday and Sunday (every race format's FP3/Qualifying
    # falls somewhere in this window, including the 2026 US GP's COTA-timed
    # 21:00-22:00 UTC Qualifying, which a single fixed-time cron missed --
    # see CLAUDE.md). predict_staged.py/predict_next_race.py are
    # schedule-aware: each hourly tick checks our own schedule and only
    # actually predicts once its gating session has genuinely ended (with a
    # buffer) and that race hasn't been predicted yet, otherwise it's a
    # clean no-op. This replaces what used to be single fixed-time crons
    # ("0 16 * * 6" for post-practice, "0 20 * * 6" for post-quali).
    - cron: "0 * * * 6,0"
  workflow_dispatch: {}

jobs:
  # Tried first: a self-hosted Mac that can actually reach F1's live timing
  # API (GitHub's hosted ubuntu-latest runners can't -- see update-fallback
  # below). If no self-hosted runner with the "macOS" label is online, this
  # job sits queued -- GitHub auto-fails a job queued for more than 24h, at
  # which point update-fallback runs. That's GitHub's own hard limit, not
  # something this workflow controls; for a faster failover than "up to 24h"
  # while the Mac is known to be offline, just run update-fallback manually
  # via workflow_dispatch in the meantime. timeout-minutes below only bounds
  # a run that DID start (e.g. the Mac is on but something hangs), not the
  # queued-and-waiting-for-a-runner phase.
  update-self-hosted:
    # Second, independent guard on top of this workflow's own trigger list
    # (schedule + workflow_dispatch only, neither outsider-triggerable) --
    # belt-and-suspenders against a future edit that adds a pull_request-
    # style trigger without noticing it'd also expose this self-hosted job.
    # See CLAUDE.md's "Security" note: never add pull_request to this
    # workflow's `on:` block while a self-hosted job exists in it.
    if: github.repository == 'jayeed17/f1-intel' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-

      - name: Set up pinned venv (refuses to run on a conda/anaconda Python)
        run: |
          rm -rf .venv
          python3 -m venv .venv
          RESOLVED="$(.venv/bin/python -c 'import sys; print(sys.executable)')"
          echo "Using interpreter: $RESOLVED"
          case "$RESOLVED" in
            *anaconda*|*miniconda*|*/conda/*|*condabin*)
              echo "::error::Resolved to a conda Python ($RESOLVED) -- refusing to run. Fix the runner's PATH (see .env in the runner's install directory) so python3 resolves to a plain/python.org interpreter, not anaconda." >&2
              exit 1
              ;;
          esac
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Build missing prebuilt data
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: .venv/bin/python -m scripts.build_prebuilt --year 2026 --only-missing

      - name: Score predictions
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: |
          .venv/bin/python -m scripts.score_predictions --year 2026
          .venv/bin/python -m scripts.score_staged --year 2026

      - name: Forecast next race (quali + race v2, pre-weekend)
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: .venv/bin/python -m scripts.predict_staged --stage forecast

      - name: Post-practice forecast (quali + race v2, after FP3)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: .venv/bin/python -m scripts.predict_staged --stage post_practice

      - name: Predict next race (v1, post-quali)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: .venv/bin/python -m scripts.predict_next_race

      - name: Post-quali race predictions (v2)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: .venv/bin/python -m scripts.predict_staged --stage post_quali

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prebuilt predictions
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update prebuilt race data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

  # Only runs if update-self-hosted didn't finish successfully (Mac offline,
  # runner crashed, a step failed, etc). GitHub's hosted runners can't reach
  # F1's live timing API at all, so this relies entirely on the OpenF1
  # fallback already built into scripts/build_prebuilt.py -- sessions built
  # this way often land "partial" (laps/results only, see
  # session_status.missing in manifest.json) until the self-hosted Mac picks
  # them up later, or scripts/complete_partials.sh is run by hand.
  update-fallback:
    needs: update-self-hosted
    if: ${{ always() && needs.update-self-hosted.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build missing prebuilt data
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: python -m scripts.build_prebuilt --year 2026 --only-missing

      - name: Score predictions
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: |
          python -m scripts.score_predictions --year 2026
          python -m scripts.score_staged --year 2026

      - name: Forecast next race (quali + race v2, pre-weekend)
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 2 * * 1", "0 14 * * 1"]'), github.event.schedule)
        run: python -m scripts.predict_staged --stage forecast

      - name: Post-practice forecast (quali + race v2, after FP3)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: python -m scripts.predict_staged --stage post_practice

      - name: Predict next race (v1, post-quali)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: python -m scripts.predict_next_race

      - name: Post-quali race predictions (v2)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 6,0'
        run: python -m scripts.predict_staged --stage post_quali

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prebuilt predictions
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update prebuilt race data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
