name: Update prebuilt race data

on:
  schedule:
    # Monday and Sunday, 02:00 UTC (a few hours after most race weekends wrap up)
    - cron: "0 2 * * 1,0"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build missing prebuilt data
        run: python -m scripts.build_prebuilt --year 2026 --only-missing

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prebuilt
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update prebuilt race data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
